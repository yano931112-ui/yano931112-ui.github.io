<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Daybook</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell list-mode" id="appShell">
      <aside class="sidebar" aria-label="レシピ一覧">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">R</div>
          <div>
            <h1>Recipe Daybook</h1>
            <p>毎日のごはん記録</p>
          </div>
        </div>

        <div class="sync-panel" id="syncPanel" hidden>
          <div>
            <strong id="syncTitle">接続エラー</strong>
            <p id="syncStatus">supabase-config.js にURLとPublishable keyを入れるとDB保存になります。</p>
          </div>
          <button id="syncBtn" type="button">同期</button>
        </div>

        <div class="toolbar">
          <button class="primary" id="newRecipeBtn" type="button">新規</button>
          <button id="exportBtn" type="button">書き出し</button>
          <label class="import-button">
            読み込み
            <input id="importInput" type="file" accept="application/json" />
          </label>
        </div>

        <label class="search">
          <span>検索</span>
          <input id="searchInput" type="search" placeholder="料理名・材料・メモ" />
        </label>

        <div class="filter-row" role="group" aria-label="表示切り替え">
          <button class="active" id="allFilter" type="button">すべて</button>
          <button id="favoriteFilter" type="button">お気に入り</button>
        </div>

        <ol class="recipe-list" id="recipeList"></ol>
      </aside>

      <main class="workspace">
        <button class="back-button" id="backToListBtn" type="button">一覧へ</button>

        <section class="hero-strip" aria-label="今日の記録">
          <div>
            <p class="eyebrow">Daily recipe journal</p>
            <h2 id="heroTitle">レシピ一覧</h2>
          </div>
          <div class="hero-plate" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </section>

        <section class="empty-editor" id="emptyEditor">
          <h2>レシピを選択してください</h2>
          <p>左の一覧からレシピを開くか、「新規」から今日のレシピを追加できます。</p>
        </section>

        <form class="editor" id="recipeForm">
          <div class="editor-head">
            <label class="date-field">
              <span>日付</span>
              <input id="dateInput" name="date" type="date" required />
            </label>
            <button class="favorite-button" id="favoriteBtn" type="button" aria-pressed="false" title="お気に入り">
              <span aria-hidden="true">☆</span>
            </button>
          </div>

          <label class="field title-field">
            <span>料理名</span>
            <input id="titleInput" name="title" type="text" placeholder="例：鶏とトマトのしょうが煮" required />
          </label>

          <section class="photo-field" aria-label="レシピ写真">
            <div class="photo-preview" id="photoPreview">
              <img id="photoPreviewImg" alt="レシピ写真のプレビュー" hidden />
              <span id="photoPlaceholder">写真を追加</span>
            </div>
            <div class="photo-actions">
              <label class="photo-button">
                写真を選択
                <input id="photoInput" type="file" accept="image/*" />
              </label>
              <button id="removePhotoBtn" type="button">写真を削除</button>
            </div>
          </section>

          <div class="field-grid">
            <label class="field">
              <span>人数</span>
              <input id="servingsInput" name="servings" type="number" min="1" max="20" value="2" />
            </label>
            <label class="field">
              <span>調理時間</span>
              <input id="timeInput" name="time" type="text" placeholder="25分" />
            </label>
            <label class="field">
              <span>カテゴリ</span>
              <select id="categoryInput" name="category">
                <option>夕食</option>
                <option>朝食</option>
                <option>昼食</option>
                <option>おやつ</option>
                <option>作り置き</option>
                <option>その他</option>
              </select>
            </label>
          </div>

          <label class="field">
            <span>材料</span>
            <textarea id="ingredientsInput" name="ingredients" rows="7" placeholder="鶏もも肉 1枚&#10;トマト 2個&#10;しょうが 1片"></textarea>
          </label>

          <label class="field">
            <span>作り方</span>
            <textarea id="stepsInput" name="steps" rows="8" placeholder="1. 材料を切る&#10;2. 炒める&#10;3. 煮込む"></textarea>
          </label>

          <label class="field">
            <span>メモ</span>
            <textarea id="notesInput" name="notes" rows="4" placeholder="次回は塩を少し控えめに、など"></textarea>
          </label>

          <div class="actions">
            <button class="primary" id="saveBtn" type="submit">保存</button>
            <button id="shareBtn" type="button">共有</button>
            <button class="danger" id="deleteBtn" type="button">削除</button>
          </div>
        </form>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
